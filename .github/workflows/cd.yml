name: CD
on:
  push:
    tags:
      - '*'

jobs:
  deploy_docker:
    name: Deploy Docker Image
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Get the git tag from the environmental variables
      # It will used to tag the docker image
      - name: Get release tag
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: echo ::set-output name=tag::"${GITHUB_REF#refs/tags/}"

      # Setup docker build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Login to Dockerhub
      - name: Login to Gihub Container Repo
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          password: ${{ secrets.GH_TOKEN }}

      # Build and push the docker image
      - name: Build and push image to Dockerhub
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: slaclab/smurf-roguev6:${{ steps.get_tag.outputs.tag }}
          build-args: |
            branch=${{ steps.get_tag.outputs.tag }}
            GH_TOKEN=${{ secrets.GH_TOKEN }}
